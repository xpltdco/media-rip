name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-anyio httpx ruff

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app/

      - name: Type check (optional)
        working-directory: backend
        continue-on-error: true
        run: ruff check app/ --select=E,W,F

      - name: Test (pytest)
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check (vue-tsc)
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Test (vitest)
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t media-rip:ci .

      - name: Smoke test
        run: |
          docker run -d --name mediarip-test -p 8000:8000 media-rip:ci
          sleep 5
          curl -f http://localhost:8000/api/health
          docker stop mediarip-test
